<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retail – Sales and Inventory Copilot (TRACK_DIPHS08)</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>" />
</head>
<body>
  <div id="app">
    <!-- Navigation Sidebar -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-logo">R</div>
        <div>
          <div class="brand-title">Retail Copilot</div>
          <div class="brand-subtitle">ID: TRACK_DIPHS08</div>
        </div>
      </div>

      <nav class="nav-menu">
        <a class="nav-item active" data-tab="dashboard" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a>
        <a class="nav-item" data-tab="pos" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          Point of Sale (POS)
        </a>
        <a class="nav-item" data-tab="inventory" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
          Inventory Audit
          <span class="nav-badge" id="sidebarLowStockBadge">4</span>
        </a>
        <a class="nav-item" data-tab="products" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          Product Catalog
        </a>
        <a class="nav-item" data-tab="suppliers" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
          Suppliers & POs
        </a>
        <a class="nav-item" data-tab="sales" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          Sales Ledger
        </a>
        <a class="nav-item" data-tab="analytics" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          Analytics & Profit
        </a>
      </nav>

      <!-- User Profile Card Footer -->
      <div class="user-profile">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" class="user-avatar" alt="Alex Morgan" />
        <div class="user-info">
          <span class="user-name">Alex Morgan</span>
          <span class="user-role">Store Manager</span>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Container -->
    <main class="main-content">
      <!-- Top Header Bar -->
      <header class="top-header">
        <div class="page-title-area">
          <h2 id="pageTitle">Executive Sales & Inventory Overview</h2>
        </div>

        <div class="header-actions">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Global search (SKU, product, PO...)" />
          </div>

          <button class="btn btn-copilot" onclick="window.toggleCopilot()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            AI Copilot
          </button>
        </div>
      </header>

      <!-- Dynamic Page Content -->
      <div class="content-body" id="mainContentBody"></div>
    </main>
  </div>

  <!-- JavaScript Modules -->
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="pos.js"></script>
  <script src="inventory.js"></script>
  <script src="products.js"></script>
  <script src="suppliers.js"></script>
  <script src="sales.js"></script>
  <script src="analytics.js"></script>
  <script src="copilot.js"></script>
</body>
</html>
